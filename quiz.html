<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f2328" />
  <link rel="icon" href="icon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luyện tập tiếng Đức</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🇩🇪 Deutsch Wortschatz</a>
    <nav class="nav"></nav>
  </header>

  <!-- Chọn cấp độ -->
  <main id="homeScreen" class="screen">
    <h1 id="modeTitle">Ngữ pháp</h1>
    <p class="sub" id="modeSub"></p>
    <div class="levels" id="levels"></div>
    <section class="settings hidden" id="speakOpts">
      <label><input type="checkbox" id="optHard" /> Chế độ khó: chỉ hiện nghĩa tiếng Việt, tự nói câu tiếng Đức</label>
    </section>
  </main>

  <!-- Danh sách bài -->
  <main id="levelScreen" class="screen hidden">
    <div class="practice-head">
      <button class="link" id="levelBackBtn">← Cấp độ</button>
      <span class="badge" id="levelTitle">A1</span>
      <span class="count" id="levelSummary"></span>
    </div>
    <div class="lessons" id="lessons"></div>
  </main>

  <!-- Lý thuyết ngữ pháp -->
  <main id="introScreen" class="screen hidden">
    <div class="practice-head">
      <button class="link" id="introBackBtn">← Danh sách bài</button>
      <span class="badge" id="introBadge">A1</span>
    </div>
    <div class="card">
      <h2 id="introTitle"></h2>
      <div class="rule" id="introText"></div>
      <div class="actions">
        <button class="btn primary" id="introStartBtn">Bắt đầu làm bài →</button>
      </div>
    </div>
  </main>

  <!-- Luyện tập -->
  <main id="practiceScreen" class="screen hidden">
    <div class="practice-head">
      <button class="link" id="backBtn">← Danh sách bài</button>
      <span class="badge" id="lessonBadge">A1</span>
      <div class="bar"><div class="bar-fill" id="sessionBar"></div></div>
      <span class="count" id="sessionCount">0/0</span>
      <span class="acc" id="sessionAcc" title="Tỉ lệ đúng ngay lần đầu">100%</span>
    </div>

    <div class="card" id="card">
      <div class="picture" id="picture"></div>
      <div class="listen-btns hidden" id="listenBtns">
        <button type="button" class="btn big" id="playBtn">🔊 Nghe</button>
        <button type="button" class="btn ghost" id="slowBtn">🐢 Nghe chậm</button>
      </div>
      <div class="gap-sentence hidden" id="gapSentence"></div>
      <div class="meaning" id="meaning"></div>
      <div class="pattern" id="subline"></div>

      <div id="speakArea" class="hidden">
        <div class="say-text" id="sayText"></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="modelBtn">🔊 Nghe mẫu</button>
          <button type="button" class="btn big mic" id="micBtn">🎤 Bấm để nói</button>
        </div>
        <div class="heard" id="heard"></div>
        <div class="tries" id="tries"></div>
      </div>

      <form id="answerForm" autocomplete="off">
        <input id="answer" type="text" spellcheck="false" autocapitalize="off" placeholder="Gõ câu trả lời…" />
      </form>

      <div class="umlauts" id="umlauts">
        <button type="button" data-ch="ä">ä</button>
        <button type="button" data-ch="ö">ö</button>
        <button type="button" data-ch="ü">ü</button>
        <button type="button" data-ch="ß">ß</button>
        <button type="button" data-ch="Ä">Ä</button>
        <button type="button" data-ch="Ö">Ö</button>
        <button type="button" data-ch="Ü">Ü</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button type="button" class="btn ghost" id="speakBtn">🔊 Đọc đáp án</button>
        <button type="button" class="btn ghost" id="skipBtn">⏭ Bỏ qua</button>
        <button type="button" class="btn primary" id="checkBtn">Kiểm tra ↵</button>
      </div>
    </div>
    <p class="tip" id="tip">Enter để kiểm tra / sang câu tiếp. Gõ ae, oe, ue, ss thay cho ä, ö, ü, ß cũng được. Dấu câu không bắt buộc.</p>
  </main>

  <!-- Kết quả -->
  <main id="doneScreen" class="screen hidden">
    <div class="card center">
      <div class="picture" id="doneIcon">🎉</div>
      <h2 id="doneTitle">Hoàn thành!</h2>
      <div class="score" id="doneScore">100%</div>
      <p id="doneText"></p>
      <div id="mistakes" class="mistakes"></div>
      <div class="actions">
        <button class="btn ghost" id="againBtn">Làm lại bài này</button>
        <button class="btn primary" id="nextLessonBtn">Bài tiếp theo →</button>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="data.js"></script>
  <script src="grammar-data.js"></script>
  <script src="phrases-data.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
